<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#ffffff">
    <title>Memoraid</title>
    
    <script>
      window.process = { env: { API_KEY: "" } };
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: { 
          extend: { 
            fontFamily: { sans: ['Inter', 'sans-serif'] },
            animation: {
              'fade-in': 'fadeIn 0.3s ease-out forwards',
              'toast-enter': 'toastEnter 0.3s ease-out forwards',
              'toast-exit': 'toastExit 0.3s ease-in forwards',
              'pulse-slow': 'pulseSlow 4s infinite ease-in-out',
              'twinkle': 'twinkle 2s infinite ease-in-out',
              'zap-random': 'zapRandom 6s infinite linear',
              'electric-flicker-soft': 'electricFlickerSoft 3s infinite',
              'hum': 'humming 0.2s infinite linear',
              'energy-orbit-slow': 'orbit 4s infinite linear',
              'snow-fall': 'snowFall 7s infinite linear',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0', transform: 'translateY(10px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              zapRandom: {
                '0%, 15%, 19%, 100%': { opacity: 0, transform: 'scale(0.9)' },
                '16%': { opacity: 0.8, transform: 'scale(1.1) translate(1px, -1px)' },
                '18%': { opacity: 0.4, transform: 'scale(1) translate(-1px, 1px)' },
              },
              electricFlickerSoft: {
                '0%, 100%, 40%, 44%': { opacity: 1, filter: 'brightness(1)' },
                '42%': { opacity: 0.95, filter: 'brightness(1.1)' },
              },
              humming: {
                '0%, 100%': { transform: 'translate(0,0)' },
                '50%': { transform: 'translate(0.1px, -0.1px)' },
              },
              snowFall: {
                '0%': { transform: 'translateY(-20px) translateX(0)', opacity: 0 },
                '10%': { opacity: 0.8 },
                '50%': { transform: 'translateY(40px) translateX(8px)' },
                '90%': { opacity: 0.8 },
                '100%': { transform: 'translateY(110px) translateX(-4px)', opacity: 0 },
              },
              pulseSlow: {
                '0%, 100%': { opacity: 0.15, transform: 'scale(1)' },
                '50%': { opacity: 0.05, transform: 'scale(1.05)' },
              },
              twinkle: {
                '0%, 100%': { opacity: 0.3, transform: 'scale(0.9)' },
                '50%': { opacity: 0.8, transform: 'scale(1)' },
              },
              orbit: {
                'from': { transform: 'rotate(0deg) translateX(32px) rotate(0deg)' },
                'to': { transform: 'rotate(360deg) translateX(32px) rotate(-360deg)' }
              }
            }
          } 
        }
      }
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./index.css">

    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@19.0.0",
        "react-dom": "https://esm.sh/react-dom@19.0.0",
        "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
        "lucide-react": "https://esm.sh/lucide-react@0.460.0",
        "@google/genai": "https://esm.sh/@google/genai@1.2.0",
        "firebase/app": "https://esm.sh/firebase@10.13.2/app",
        "firebase/auth": "https://esm.sh/firebase@10.13.2/auth",
        "firebase/firestore": "https://esm.sh/firebase@10.13.2/firestore",
        "firebase/functions": "https://esm.sh/firebase@10.13.2/functions",
        "firebase/analytics": "https://esm.sh/firebase@10.13.2/analytics",
        "pdf-lib": "https://esm.sh/pdf-lib@1.17.1",
        "pptxgenjs": "https://esm.sh/pptxgenjs@3.12.0",
        "jszip": "https://esm.sh/jszip@3.10.1",
        "html2canvas": "https://esm.sh/html2canvas@1.4.1",
        "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
        "vite-plugin-pwa": "https://esm.sh/vite-plugin-pwa@^1.2.0",
        "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2",
        "firebase/": "https://esm.sh/firebase@^12.7.0/",
        "react/": "https://esm.sh/react@^19.2.3/",
        "vite": "https://esm.sh/vite@^7.3.0",
        "firebase-functions": "https://esm.sh/firebase-functions@^7.0.2",
        "firebase-admin": "https://esm.sh/firebase-admin@^13.6.0"
      }
