<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#ffffff">
    <title>Memoraid</title>
    
    <script>
      window.process = { env: { API_KEY: "" } };
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: { 
          extend: { 
            fontFamily: { sans: ['Inter', 'sans-serif'] },
            animation: {
              'fade-in': 'fadeIn 0.3s ease-out forwards',
              'fade-in-fast': 'fadeIn 0.15s ease-out forwards',
              'pulse-slow': 'pulseSlow 4s infinite ease-in-out',
              'twinkle': 'twinkle 3s infinite ease-in-out',
              'snow-fall': 'snowFall 10s infinite linear',
              'hum': 'hum 2s infinite ease-in-out',
              'electric-flicker-soft': 'electricFlicker 5s infinite',
              'energy-orbit-slow': 'energyOrbit 12s infinite linear',
              'toast-enter': 'toastEnter 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards',
              'toast-exit': 'toastExit 0.3s ease-in forwards',
              'add-capsule': 'addCapsule 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0', transform: 'translateY(10px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              pulseSlow: {
                '0%, 100%': { opacity: 1, transform: 'scale(1)' },
                '50%': { opacity: 0.95, transform: 'scale(1.02)' },
              },
              twinkle: {
                '0%, 100%': { opacity: 0.3, transform: 'scale(0.95)' },
                '50%': { opacity: 1, transform: 'scale(1.05)' },
              },
              snowFall: {
                '0%': { transform: 'translateY(-20px) translateX(0)', opacity: 0 },
                '10%': { opacity: 0.8 },
                '90%': { opacity: 0.8 },
                '100%': { transform: 'translateY(80px) translateX(15px)', opacity: 0 },
              },
              hum: {
                '0%, 100%': { transform: 'translate(0, 0) rotate(0deg)' },
                '25%': { transform: 'translate(0.5px, 0.5px) rotate(0.1deg)' },
                '50%': { transform: 'translate(-0.5px, 0.5px) rotate(-0.1deg)' },
                '75%': { transform: 'translate(0.5px, -0.5px) rotate(0.1deg)' },
              },
              electricFlicker: {
                '0%, 18%, 22%, 25%, 53%, 57%, 100%': { opacity: 1 },
                '20%, 24%, 55%': { opacity: 0.7 },
              },
              energyOrbit: {
                '0%': { transform: 'rotate(0deg) translateX(8px) rotate(0deg)' },
                '100%': { transform: 'rotate(360deg) translateX(8px) rotate(-360deg)' },
              },
              toastEnter: {
                '0%': { transform: 'translateY(100%) scale(0.9)', opacity: 0 },
                '100%': { transform: 'translateY(0) scale(1)', opacity: 1 },
              },
              toastExit: {
                '0%': { transform: 'translateX(0) opacity(1)' },
                '100%': { transform: 'translateX(100%) opacity(0)' },
              },
              addCapsule: {
                '0%': { transform: 'scale(0.8) translateY(20px)', opacity: 0 },
                '100%': { transform: 'scale(1) translateY(0)', opacity: 1 },
              }
            }
          } 
        }
      }
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">

    "pdf-lib": "https://esm.sh/pdf-lib@1.17.1",

</script>
    <style>
      #preloader {
        position: fixed;
        inset: 0;
        background: #ffffff;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.4s ease-out;
      }
      .dark #preloader { background: #09090b; }
      
      .loader-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
        opacity: 0;
        animation: fadeIn 0.5s ease-out forwards;
      }

      .loader-logo {
        width: 100px;
        height: 100px;
        object-fit: contain;
      }

      @media (min-width: 768px) {
        .loader-logo {
          width: 120px;
          height: 120px;
        }
      }

      .loader-text {
        font-family: 'Inter', sans-serif;
        font-weight: 900;
        font-size: 28px;
        letter-spacing: -0.05em;
        text-transform: uppercase;
        color: #059669;
        margin: 0;
      }
      @media (min-width: 768px) {
        .loader-text {
          font-size: 36px;
        }
      }
      .dark .loader-text { color: #ffffff; }
    </style>
  <link rel="stylesheet" href="/index.css">
</head>
  <body class="bg-gray-50 dark:bg-zinc-950 text-slate-800 dark:text-zinc-200 selection:bg-emerald-200">
    <div id="preloader">
      <div class="loader-content">
        <img src="/icon.svg" alt="Memoraid" class="loader-logo" />
        <h1 class="loader-text">Memoraid</h1>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
    <script>
      window.addEventListener('load', () => {
        const loader = document.getElementById('preloader');
        if (loader) {
          setTimeout(() => {
            loader.style.opacity = '0';
            setTimeout(() => loader.remove(), 400);
          }, 600);
        }
      });
    </script>
  </body>
</html>
