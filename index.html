<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#ffffff">
    <title>Memoraid</title>
    
    <script>
      window.process = { env: { API_KEY: "" } };
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: { 
          extend: { 
            fontFamily: { sans: ['Inter', 'sans-serif'] },
            animation: {
              'fade-in': 'fadeIn 0.3s ease-out forwards',
              'pulse-slow': 'pulseSlow 4s infinite ease-in-out',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0', transform: 'translateY(10px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              pulseSlow: {
                '0%, 100%': { opacity: 1, transform: 'scale(1)' },
                '50%': { opacity: 0.95, transform: 'scale(1.02)' },
              },
            }
          } 
        }
      }
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
    "lucide-react": "https://esm.sh/lucide-react@0.460.0",
    "@google/genai": "https://esm.sh/@google/genai@1.2.0",
    "firebase/app": "https://esm.sh/firebase@10.13.2/app",
    "firebase/auth": "https://esm.sh/firebase@10.13.2/auth",
    "firebase/firestore": "https://esm.sh/firebase@10.13.2/firestore",
    "firebase/functions": "https://esm.sh/firebase@10.13.2/functions",
    "firebase/analytics": "https://esm.sh/firebase@10.13.2/analytics",
    "pdf-lib": "https://esm.sh/pdf-lib@1.17.1",
    "pptxgenjs": "https://esm.sh/pptxgenjs@3.12.0",
    "jszip": "https://esm.sh/jszip@3.10.1",
    "html2canvas": "https://esm.sh/html2canvas@1.4.1",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "vite": "https://esm.sh/vite@^7.3.1",
    "firebase/": "https://esm.sh/firebase@^12.7.0/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2",
    "firebase-admin": "https://esm.sh/firebase-admin@^13.6.0",
    "firebase-functions/": "https://esm.sh/firebase-functions@^7.0.3/",

    <style>
      #preloader {
        position: fixed;
        inset: 0;
        background: #ffffff;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.4s ease-out;
      }
      .dark #preloader { background: #09090b; }
      
      .loader-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        animation: pulseSlow 2s infinite ease-in-out;
      }

      .loader-logo {
        width: 80px;
        height: 80px;
        filter: drop-shadow(0 10px 20px rgba(16, 185, 129, 0.15));
      }

      @media (min-width: 768px) {
        .loader-logo {
          width: 120px;
          height: 120px;
        }
        .loader-content {
          gap: 24px;
        }
      }

      .loader-text {
        font-family: 'Inter', sans-serif;
        font-weight: 900;
        font-size: 24px;
        letter-spacing: -0.05em;
        text-transform: uppercase;
        color: #064e3b;
        margin: 0;
      }
      @media (min-width: 768px) {
        .loader-text {
          font-size: 36px;
        }
      }
      .dark .loader-text { color: #ffffff; }
    </style>
  <link rel="stylesheet" href="/index.css">
</head>
  <body class="bg-gray-50 dark:bg-zinc-950 text-slate-800 dark:text-zinc-200 selection:bg-emerald-200">
    <div id="preloader">
      <div class="loader-content">
        <img src="/icon.svg" alt="Memoraid" class="loader-logo" />
        <h1 class="loader-text">Memoraid</h1>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
    <script>
      window.addEventListener('load', () => {
        const loader = document.getElementById('preloader');
        if (loader) {
          setTimeout(() => {
            loader.style.opacity = '0';
            setTimeout(() => loader.remove(), 400);
          }, 800);
        }
      });
    </script>
  </body>
</html>
