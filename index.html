<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#ffffff">
    <title>Memoraid</title>
    
    <script>
      window.process = { env: { API_KEY: "" } };
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: { 
          extend: { 
            fontFamily: { sans: ['Inter', 'sans-serif'] },
            animation: {
              'fade-in': 'fadeIn 0.3s ease-out forwards',
              'toast-enter': 'toastEnter 0.3s ease-out forwards',
              'toast-exit': 'toastExit 0.3s ease-in forwards',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0', transform: 'translateY(10px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              toastEnter: {
                '0%': { opacity: '0', transform: 'translateY(20px) scale(0.9)' },
                '100%': { opacity: '1', transform: 'translateY(0) scale(1)' },
              },
              toastExit: {
                '0%': { opacity: '1', transform: 'scale(1)' },
                '100%': { opacity: '0', transform: 'scale(0.9)' },
              }
            }
          } 
        }
      }
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./index.css">

    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
    "lucide-react": "https://esm.sh/lucide-react@0.460.0",
    "@google/genai": "https://esm.sh/@google/genai@1.2.0",
    "firebase/app": "https://esm.sh/firebase@10.13.2/app",
    "firebase/auth": "https://esm.sh/firebase@10.13.2/auth",
    "firebase/firestore": "https://esm.sh/firebase@10.13.2/firestore",
    "firebase/functions": "https://esm.sh/firebase@10.13.2/functions",
    "firebase/analytics": "https://esm.sh/firebase@10.13.2/analytics",
    "pdf-lib": "https://esm.sh/pdf-lib@1.17.1",
    "pptxgenjs": "https://esm.sh/pptxgenjs@3.12.0",
    "jszip": "https://esm.sh/jszip@3.10.1",
    "html2canvas": "https://esm.sh/html2canvas@1.4.1",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "vite-plugin-pwa": "https://esm.sh/vite-plugin-pwa@^1.2.0",

  <link rel="stylesheet" href="/index.css">
</head>
  <body class="bg-gray-50 dark:bg-zinc-950 text-slate-800 dark:text-zinc-200 selection:bg-emerald-200">
    <div id="splash-screen" style="position:fixed;inset:0;background:#fff;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity 0.5s">
      <div style="width:48px;height:48px;border:4px solid #f3f3f3;border-top:4px solid #10b981;border-radius:50%;animation:spin 1s linear infinite"></div>
      <h1 style="margin-top:20px;font-family:Inter,sans-serif;font-weight:900;color:#065f46;letter-spacing:-0.05em">MEMORAID</h1>
      <style>@keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}</style>
      <script>
        window.addEventListener('load', () => {
          setTimeout(()=>{
            const s=document.getElementById('splash-screen');
            if(s){s.style.opacity='0';setTimeout(()=>s.remove(),500)}
          },1000);
        });
      </script>
    </div>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
