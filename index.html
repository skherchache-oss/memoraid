    <script>
      window.process = { env: { API_KEY: "" } };

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: { 
          extend: { 
            fontFamily: { sans: ['Inter', 'sans-serif'] },
            animation: {
              'fade-in': 'fadeIn 0.3s ease-out forwards',
              'fade-in-fast': 'fadeIn 0.15s ease-out forwards',
              'pulse-slow': 'pulseSlow 4s infinite ease-in-out',
              'twinkle': 'twinkle 3s infinite ease-in-out',
              'snow-fall': 'snowFall 10s infinite linear',
              'hum': 'hum 2s infinite ease-in-out',
              'electric-flicker-soft': 'electricFlicker 5s infinite',
              'energy-orbit-slow': 'energyOrbit 12s infinite linear',
              'toast-enter': 'toastEnter 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards',
              'toast-exit': 'toastExit 0.3s ease-in forwards',
              'add-capsule': 'addCapsule 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0', transform: 'translateY(10px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              pulseSlow: {
                '0%, 100%': { opacity: 1, transform: 'scale(1)' },
                '50%': { opacity: 0.95, transform: 'scale(1.02)' },
              },
              twinkle: {
                '0%, 100%': { opacity: 0.3, transform: 'scale(0.95)' },
                '50%': { opacity: 1, transform: 'scale(1.05)' },
              },
              snowFall: {
                '0%': { transform: 'translateY(-20px) translateX(0)', opacity: 0 },
                '10%': { opacity: 0.8 },
                '90%': { opacity: 0.8 },
                '100%': { transform: 'translateY(80px) translateX(15px)', opacity: 0 },
              },
              hum: {
                '0%, 100%': { transform: 'translate(0, 0) rotate(0deg)' },
                '25%': { transform: 'translate(0.5px, 0.5px) rotate(0.1deg)' },
                '50%': { transform: 'translate(-0.5px, 0.5px) rotate(-0.1deg)' },
                '75%': { transform: 'translate(0.5px, -0.5px) rotate(0.1deg)' },
              },
              electricFlicker: {
                '0%, 18%, 22%, 25%, 53%, 57%, 100%': { opacity: 1 },
                '20%, 24%, 55%': { opacity: 0.7 },
              },
              energyOrbit: {
                '0%': { transform: 'rotate(0deg) translateX(8px) rotate(0deg)' },
                '100%': { transform: 'rotate(360deg) translateX(8px) rotate(-360deg)' },
              },
              toastEnter: {
                '0%': { transform: 'translateY(100%) scale(0.9)', opacity: 0 },
                '100%': { transform: 'translateY(0) scale(1)', opacity: 1 },
              },
              toastExit: {
                '0%': { transform: 'translateX(0) opacity(1)' },
                '100%': { transform: 'translateX(100%) opacity(0)' },
              },
              addCapsule: {
                '0%': { transform: 'scale(0.8) translateY(20px)', opacity: 0 },
                '100%': { transform: 'scale(1) translateY(0)', opacity: 1 },
              }
            }
          } 
        }
      }
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">

    <style>
      #preloader {
        position: fixed;
        inset: 0;
        background: #ffffff;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.5s ease-out;
      }
      .dark #preloader { background: #09090b; }
      
      .loader-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        opacity: 0;
        animation: fadeInLoader 0.6s ease-out forwards;
      }

      @keyframes fadeInLoader {
        from { opacity: 0; transform: scale(0.95); }
        to { opacity: 1; transform: scale(1); }
      }

      .loader-logo {
        width: 100px;
        height: 100px;
        margin-bottom: 24px;
        animation: pulseLogo 2s infinite ease-in-out;
      }

      @keyframes pulseLogo {
        0%, 100% { transform: scale(1); filter: drop-shadow(0 0 0px rgba(16, 185, 129, 0)); }
        50% { transform: scale(1.05); filter: drop-shadow(0 0 15px rgba(16, 185, 129, 0.2)); }
      }

      .loader-text {
        font-family: 'Inter', sans-serif;
        font-weight: 900;
        font-size: 24px;
        text-transform: uppercase;
        letter-spacing: -0.05em;
        color: #064e3b;
        margin: 0;
      }
      .dark .loader-text { color: #ffffff; }

      .loader-subtext {
        font-family: 'Inter', sans-serif;
        font-weight: 900;
        font-size: 8px;
        text-transform: uppercase;
        letter-spacing: 0.6em;
        color: #94a3b8;
        margin-top: 8px;
        padding-left: 0.6em;
      }
    </style>
  <link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="preloader">
      <div class="loader-content">
        <!-- Inlined SVG to guarantee sharpness and immediate display without flash -->
        <svg class="loader-logo" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect width="512" height="512" rx="120" fill="white"/>
          <g transform="translate(52, 52) scale(17)">
            <path d="M 11.4 4 C 11.1 3.8, 11.0 3.5, 10.7 3.5 C 5 3.5, 2 7, 2 12 C 2 17, 5 20.5, 10.7 20.5 C 11.0 20.5, 11.1 20.2, 11.4 20 L 11.4 4 Z" stroke="#059669" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M 12.6 4 C 12.9 3.8, 13.0 3.5, 13.3 3.5 C 19 3.5, 22 7, 22 12 C 22 17, 19 20.5, 13.3 20.5 C 13.0 20.5, 12.9 20.2, 12.6 20 L 12.6 4 Z" stroke="#059669" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M 5.6 8 q 0.5 0.5 1 0 q 0.5 -0.5 1 0 M 5.6 12 q 0.5 0.5 1 0 q 0.5 -0.5 1 0 M 5.6 16 q 0.5 0.5 1 0 q 0.5 -0.5 1 0 M 16.4 8 q 0.5 0.5 1 0 q 0.5 -0.5 1 0 M 16.4 12 q 0.5 0.5 1 0 q 0.5 -0.5 1 0 M 16.4 16 q 0.5 0.5 1 0 q 0.5 -0.5 1 0" stroke="#f59e0b" stroke-width="1.5" fill="none" stroke-linecap="round" />
          </g>
        </svg>
        <h1 class="loader-text">MEMORAID</h1>
        <p class="loader-subtext">Architecture Cognitive</p>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>

    <script>
      window.addEventListener('load', () => {
        const preloader = document.getElementById('preloader');
        if (preloader) {
          setTimeout(() => {
            preloader.style.opacity = '0';
            setTimeout(() => {
              preloader.style.display = 'none';
            }, 500);
          }, 800); // Small delay to let initial React render happen
        }
      });
    </script>
  </body>
